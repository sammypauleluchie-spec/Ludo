<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ludo Online</title>
<style>
:root{box-sizing:border-box;padding:env(safe-area-inset-top,0px) 12px env(safe-area-inset-bottom,0px);--bg:#faf7f0;--fg:#222;--cell:#fff;--line:#c9c2b2;--card:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b1f;--fg:#eee;--cell:#2a2a30;--line:#555;--card:#26262c}}
:root[data-theme="dark"]{--bg:#1b1b1f;--fg:#eee;--cell:#2a2a30;--line:#555;--card:#26262c}
*{box-sizing:border-box}
body{margin:0 auto;max-width:520px;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:12px 0}
h1{font-size:1.3rem;margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
button,input{font:inherit;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
button{cursor:pointer;font-weight:600}
button:disabled{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.go{background:#3e63dd;color:#fff;border-color:#3e63dd}
svg{width:100%;height:auto;display:block;border-radius:12px}
.tok{cursor:default}.tok.can{cursor:pointer;animation:p .7s infinite alternate}
@keyframes p{to{r:.5}}
#msg{min-height:1.4em;font-weight:600}
</style></head><body>
<h1>🎲 Ludo Online</h1>
<div id="app" class="card">Connecting…</div>
<div id="game" hidden><div class="card"><div id="msg"></div><div class="row"><button id="roll" class="go">Roll dice</button><button id="skip" hidden>Skip absent player</button><button id="leave">Menu</button></div></div><div id="board"></div></div>
<script>
const COL=['#e5484d','#30a46c','#3e63dd','#f5c518'],NAME=['Red','Green','Blue','Yellow'];
const START=[0,13,26,39],SAFE=[0,8,13,21,26,34,39,47],BASE=[[0,0],[9,0],[9,9],[0,9]];
const T=[],add=(x,y)=>T.push([x,y]);
for(let x=1;x<=5;x++)add(x,6);for(let y=5;y>=0;y--)add(6,y);add(7,0);add(8,0);
for(let y=1;y<=5;y++)add(8,y);for(let x=9;x<=14;x++)add(x,6);add(14,7);add(14,8);
for(let x=13;x>=9;x--)add(x,8);for(let y=9;y<=14;y++)add(8,y);add(7,14);add(6,14);
for(let y=13;y>=9;y--)add(6,y);for(let x=5;x>=0;x--)add(x,8);add(0,7);add(0,6);
const HC=[k=>[1+k,7],k=>[7,1+k],k=>[13-k,7],k=>[7,13-k]];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let nr=null,st=null,code='',myName='';

function xy(c,p,i){
  if(p<0)return[BASE[c][0]+1.5+(i%2)*2,BASE[c][1]+1.5+(i>>1)*2];
  if(p<=50){const t=T[(START[c]+p)%52];return[t[0]+.5,t[1]+.5]}
  if(p<=55){const t=HC[c](p-51);return[t[0]+.5,t[1]+.5]}
  return[7.5+[-.6,0,.6,0][c]*1,7.5+[0,-.6,0,.6][c]*1];
}
const me=()=>nr&&nr.peers().find(p=>p.isMe&&p.sameTab);
const seated=()=>nr?nr.peers().filter(p=>p.presence.seat>=0&&p.presence.seat!=null):[];
const next=s=>{let t=s.turn;do{t=(t+1)%4}while(!s.active.includes(t));return t};
const movable=(s,c,d)=>[0,1,2,3].filter(i=>{const p=s.pos[c][i];return p<0?d==6:p<56&&p+d<=56});
const mine=()=>st&&me()&&st.owners[st.turn]===me().peer;

function commit(s){st=s;nr.emit('state',s);render()}
function roll(bot){
  if((!bot&&!mine())||st.dice||st.winner!=null)return;
  const s=JSON.parse(JSON.stringify(st)),d=1+Math.floor(Math.random()*6);
  s.n++;s.dice=d;s.last={c:s.turn,d};
  if(!movable(s,s.turn,d).length){s.dice=0;s.turn=next(s)}
  commit(s);
}
function move(i,bot){
  if((!bot&&!mine())||!st.dice)return;
  const s=JSON.parse(JSON.stringify(st)),c=s.turn,d=s.dice;
  if(!movable(s,c,d).includes(i))return;
  const p=s.pos[c][i],np=p<0?0:p+d;s.pos[c][i]=np;
  if(np<=50){const idx=(START[c]+np)%52;
    if(!SAFE.includes(idx))s.active.forEach(o=>{if(o!=c)s.pos[o].forEach((q,j)=>{if(q>=0&&q<=50&&(START[o]+q)%52==idx)s.pos[o][j]=-1})})}
  s.n++;s.dice=0;
  if(s.pos[c].every(q=>q==56))s.winner=c;else if(d!=6)s.turn=next(s);
  commit(s);
}
function skip(){
  const s=JSON.parse(JSON.stringify(st));s.n++;s.dice=0;s.turn=next(s);commit(s);
}
function start(){
  const owners={},active=[];
  seated().forEach(p=>{if(!(p.presence.seat in owners)){owners[p.presence.seat]=p.peer;active.push(p.presence.seat)}});
  active.sort();
  commit({n:1,active,owners,turn:active[0],dice:0,last:null,winner:null,pos:[0,1,2,3].map(()=>[-1,-1,-1,-1])});
}
function recv(m){
  if(m.sameTab)return;const s=m.data;
  if(!s||typeof s.n!=='number'||(st&&s.n<=st.n))return;
  if(st){const o=st.owners[st.turn];if(m.peer!==o&&nr.peers().some(p=>p.peer===o))return}
  st=s;render();
}
function myCid(){let c='';try{c=localStorage.getItem('ludo-cid')||''}catch(e){}
  if(!c){c=Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,8);try{localStorage.setItem('ludo-cid',c)}catch(e){}}return c}
function connect(code){return new Promise((res,rej)=>{
  let ws,myId=null,peers=[],first=true,mem={};const ls={},pl=[];
  const send=o=>ws&&ws.readyState===1&&ws.send(JSON.stringify(o));
  const r={peers:()=>peers,on:(t,f)=>{(ls[t]=ls[t]||[]).push(f)},emit:(t,d)=>send({t:'emit',topic:t,data:d}),
    presence:p=>{Object.assign(mem,p);send({t:'presence',patch:p})},onPeers:f=>pl.push(f)};
  const open=()=>{
    ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
    ws.onopen=()=>send({t:'join',room:code,cid:myCid()});
    ws.onmessage=e=>{const m=JSON.parse(e.data);
      if(m.t==='hi'){myId=m.peer;
        if(first){first=false;res(r)}
        else{send({t:'presence',patch:mem});send({t:'emit',topic:'need'});const x=$('msg');if(st&&x)render()}}
      else if(m.t==='peers'){peers=m.peers.map(p=>({...p,isMe:p.peer===myId,sameTab:p.peer===myId}));pl.forEach(f=>f())}
      else if(m.t==='msg'){(ls[m.topic]||[]).forEach(f=>f({topic:m.topic,data:m.data,peer:m.peer,sameTab:m.peer===myId}))}};
    ws.onerror=()=>{if(first)rej({})};
    ws.onclose=()=>{if(first)return;const x=$('msg');if(x&&st)x.textContent='Connection lost, reconnecting…';setTimeout(open,2000)};
  };
  open();setInterval(()=>send({t:'ping'}),25000);
})}
async function join(){
  code=($('code').value||'').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,20);
  myName=($('nick').value||'Player').slice(0,14);
  if(!code)return;
  try{nr=await connect(code)}catch(e){$('app').textContent='Could not connect to the server. Try again in a minute.';return}
  nr.on('state',recv);nr.on('need',()=>{if(st)nr.emit('state',st)});
  nr.onPeers(render);let sv;try{sv=localStorage.getItem('ludo-seat-'+code)}catch(e){}
  nr.presence(sv!=null&&sv!==''?{name:myName,seat:+sv}:{name:myName});nr.emit('need');render();
}
let local=false,botT=null;
function isBot(){return local&&st&&st.winner==null&&String(st.owners[st.turn]).startsWith('bot')}
function botTick(){
  if(!isBot()||botT)return;
  botT=setTimeout(()=>{botT=null;if(!isBot())return;if(!st.dice)roll(true);else move(botPick(),true)},st.dice?700:900);
}
function botPick(){
  const c=st.turn,d=st.dice,opts=movable(st,c,d);let best=opts[0],bs=-1;
  opts.forEach(i=>{const p=st.pos[c][i],np=p<0?0:p+d;let sc=np;
    if(np==56)sc+=90;if(p<0)sc+=50;
    if(np<=50){const idx=(START[c]+np)%52;
      if(SAFE.includes(idx))sc+=20;
      else if(st.active.some(o=>o!=c&&st.pos[o].some(q=>q>=0&&q<=50&&(START[o]+q)%52==idx)))sc+=100}
    if(sc>bs){bs=sc;best=i}});
  return best}
function startSingle(){
  myName=($('nick').value||'You').slice(0,14);const n=+$('bots').value;
  const seats=n==1?[0,2]:[0,1,2,3].slice(0,n+1);
  const pe=[{peer:'me',isMe:true,sameTab:true,presence:{name:myName,seat:0}}].concat(seats.slice(1).map((c,k)=>({peer:'bot'+k,isMe:false,sameTab:false,presence:{name:'Computer',seat:c}})));
  nr={peers:()=>pe,on(){},emit(){},presence(){},onPeers(){}};local=true;
  const owners={};seats.forEach((c,k)=>owners[c]=k?'bot'+(k-1):'me');
  st={n:1,active:seats,owners,turn:0,dice:0,last:null,winner:null,pos:[0,1,2,3].map(()=>[-1,-1,-1,-1])};
  render();}
function pick(c){try{localStorage.setItem('ludo-seat-'+code,c)}catch(e){}nr.presence({seat:c});}
function render(){
  const app=$('app');
  if(!nr){
    if(!app.dataset.done){app.dataset.done=1;app.innerHTML='<b>Join or create a game</b><div class="row"><input id="nick" placeholder="Your name" maxlength="14"><input id="code" placeholder="Room code" maxlength="20" value="'+Math.random().toString(36).slice(2,6)+'" size="8"></div><div class="row"><button class="go" id="j">Join room</button></div><div class="row"><select id="bots"><option value="1">vs 1 computer</option><option value="2">vs 2 computers</option><option value="3" selected>vs 3 computers</option></select><button id="sp">Play solo</button></div><p style="opacity:.7;font-size:.9rem">Everyone types the same room code. Share the code with friends.</p>';$('j').onclick=join;$('sp').onclick=startSingle}
    return;
  }
  const mp=me(),taken={};seated().forEach(p=>taken[p.presence.seat]=p);
  if(!st){
    $('game').hidden=true;
    app.innerHTML='<b>Room: '+esc(code)+'</b> · '+nr.peers().length+' here<div class="row">'+[0,1,2,3].map(c=>'<button data-c="'+c+'" style="border-color:'+COL[c]+'"'+(taken[c]&&!taken[c].isMe?' disabled':'')+'>'+NAME[c]+(taken[c]?' · '+esc(taken[c].presence.name||'?'):'')+'</button>').join('')+'</div><div class="row"><button class="go" id="st"'+(Object.keys(taken).length<2?' disabled':'')+'>Start game</button></div><p style="opacity:.7;font-size:.9rem">Pick a colour, then someone hits Start (2–4 players).</p>';
    app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>pick(+b.dataset.c));
    $('st').onclick=start;return;
  }
  app.hidden=true;$('game').hidden=false;
  const c=st.turn,who=(i)=>{const p=nr.peers().find(q=>q.peer===st.owners[i]);return NAME[i]+(p?' ('+(p.presence.name||'?')+')':' (away)')};
  let t=st.winner!=null?'🏆 '+who(st.winner)+' wins!':mine()?(st.dice?'You rolled '+st.dice+' — tap a glowing token':'Your turn — roll!'):who(c)+"'s turn";
  if(st.last&&!st.dice&&st.winner==null)t+='  ·  '+NAME[st.last.c]+' rolled '+st.last.d;
  $('msg').textContent=t;
  $('roll').disabled=!(mine()&&!st.dice&&st.winner==null);
  const away=!nr.peers().some(p=>p.peer===st.owners[c]);
  $('skip').hidden=!(away&&st.winner==null);
  draw();botTick();
}
function draw(){
  let s='<svg viewBox="0 0 15 15">';
  for(let c=0;c<4;c++){const[b0,b1]=BASE[c];s+='<rect x="'+b0+'" y="'+b1+'" width="6" height="6" fill="'+COL[c]+'" opacity=".85"/><rect x="'+(b0+1)+'" y="'+(b1+1)+'" width="4" height="4" rx=".6" fill="var(--cell)"/>'}
  T.forEach((t,i)=>{const sc=START.indexOf(i);s+='<rect x="'+t[0]+'" y="'+t[1]+'" width="1" height="1" fill="'+(sc>=0?COL[sc]:'var(--cell)')+'" stroke="var(--line)" stroke-width=".05"/>'+(SAFE.includes(i)&&sc<0?'<text x="'+(t[0]+.5)+'" y="'+(t[1]+.72)+'" font-size=".6" text-anchor="middle" fill="var(--line)">★</text>':'')});
  for(let c=0;c<4;c++)for(let k=0;k<5;k++){const h=HC[c](k);s+='<rect x="'+h[0]+'" y="'+h[1]+'" width="1" height="1" fill="'+COL[c]+'" opacity=".7" stroke="var(--line)" stroke-width=".05"/>'}
  s+='<rect x="6" y="6" width="3" height="3" fill="var(--line)" opacity=".5"/>';
  const cnt={},can=mine()&&st.dice?movable(st,st.turn,st.dice):[];
  st.active.forEach(c=>st.pos[c].forEach((p,i)=>{
    let[x,y]=xy(c,p,i);const k=x+','+y;const n=cnt[k]||0;cnt[k]=n+1;if(p>=0)x+=n*.18,y-=n*.18;
    const ok=c==st.turn&&can.includes(i);
    s+='<circle class="tok'+(ok?' can':'')+'" data-i="'+i+'" cx="'+x+'" cy="'+y+'" r="'+(ok?.42:.36)+'" fill="'+COL[c]+'" stroke="'+(ok?'#000':'#fff')+'" stroke-width="'+(ok?.12:.08)+'"/>';
  }));
  $('board').innerHTML=s+'</svg>';
  $('board').querySelectorAll('.can').forEach(e=>e.onclick=()=>move(+e.dataset.i));
}
$('roll').onclick=()=>roll();$('leave').onclick=()=>{if(confirm('Leave this game?'))location.reload()};$('skip').onclick=skip;render();
</script></body></html>
